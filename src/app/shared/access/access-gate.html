<main class="wrap narrow access-gate">
  <h1>{{ i18n.t('access.title') }}</h1>
  <p class="lede">{{ i18n.t('access.lede') }}</p>
  <form (ngSubmit)="submit()">
    <label class="field" for="access-password">{{ i18n.t('access.label') }}</label>
    <div class="access-row">
      <input
        id="access-password"
        name="password"
        type="password"
        pInputText
        autocomplete="current-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event); wrong.set(false)"
      />
      <p-button type="submit" [label]="i18n.t('access.submit')" />
    </div>
    @if (wrong()) {
      <p class="help error" role="alert">{{ i18n.t('access.wrong') }}</p>
    }
  </form>
</main>
