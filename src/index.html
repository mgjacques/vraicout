<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>VraiCoût</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Des outils gratuits, sans inscription, qui calculent ce que ça coûte avec vos chiffres. Chaque montant montre sa formule, et le calcul se fait dans votre navigateur."
    />
    <meta name="theme-color" content="#0f6b62" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Theme before the first paint, so a dark page never flashes light (see ThemeService).
      try {
        if (localStorage.getItem('vraicout.theme') === 'dark')
          document.documentElement.classList.add('app-dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
